<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menexia The Sexy Truck</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      cursor: pointer;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Image de la blague -->
  <img src="mablague.jpg" alt="Blague Camion">

  <!-- Fichier audio -->
  <audio id="klaxon" src="camion.mp3" preload="auto"></audio>

<script>
    let timer = null;

    // Joue le son à CHAQUE clic sur la page/image
    document.addEventListener('click', function() {
      const audio = document.getElementById('klaxon');

      // Annule le chrono d'arrêt précédent s'il y en avait un en cours
      if (timer) {
        clearTimeout(timer);
      }

      // Remet le son au début et le joue
      audio.currentTime = 0;
      audio.play();

      // Programme l'arrêt automatique 2 secondes après LE DERNIER clic
      timer = setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
      }, 2000);
    });
  </script>

</body>
</html>
