<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menexia The Sexy Truck</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      cursor: pointer;
      overflow: hidden;
    }

    /* Conteneur global avec ratio verrouillé */
    .conteneur-camion {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 900px; /* Taille max sur écran PC */
      transition: transform 0.2s ease-out;
      will-change: transform;
    }

    /* L'image de base */
    .image-base {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s ease;
    }

    /* Effet survol sur PC */
    .conteneur-camion:hover .image-base {
      transform: scale(1.02);
    }

    /* --- ANIMATION : SECOUSSE + ZOOM --- */
    @keyframes secousseEtZoom {
      0% { transform: scale(1.15) translate(0, 0) rotate(0deg); }
      20% { transform: scale(1.15) translate(-4px, 4px) rotate(-1deg); }
      40% { transform: scale(1.15) translate(-4px, -4px) rotate(1deg); }
      60% { transform: scale(1.15) translate(4px, 4px) rotate(0deg); }
      80% { transform: scale(1.15) translate(4px, -4px) rotate(1deg); }
      100% { transform: scale(1.15) translate(0, 0) rotate(-1deg); }
    }

    .action-clic {
      animation: secousseEtZoom 0.1s infinite !important;
    }

    /* --- LES PHARES / YEUX --- */
    .oeil {
      position: absolute;
      width: 3.5%;  /* Taille basée sur la largeur de l'image (identique PC/Mobile) */
      padding-bottom: 3.5%; /* Garde une forme parfaitement ronde */
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.1s ease-in, box-shadow 0.2s ease-out;
      transform: translate(-50%, -50%);
    }

    /* Positions relatives universelles */
    #oeil-gauche {
      top: 37%;
      left: 29%;
    }

    #oeil-droit {
      top: 36.3%;
      left: 39.3%;
    }

    .phare-actif {
      opacity: 1;
      box-shadow: 0 0 30px 10px #fff, 0 0 60px 20px #ff0;
    }
  </style>
</head>
<body>

  <div class="conteneur-camion" id="monCamion">
    <img src="mablague.jpg" alt="Blague Camion" class="image-base" id="imgCamion">
    
    <!-- Les Yeux / Phares -->
    <div class="oeil" id="oeil-gauche"></div>
    <div class="oeil" id="oeil-droit"></div>
  </div>

  <audio id="klaxon" src="camion.mp3" preload="auto"></audio>

  <script>
    let timer = null;

    document.addEventListener('click', function() {
      const audio = document.getElementById('klaxon');
      const camion = document.getElementById('monCamion');
      const oeilG = document.getElementById('oeil-gauche');
      const oeilD = document.getElementById('oeil-droit');

      if (timer) {
        clearTimeout(timer);
      }

      audio.currentTime = 0;
      audio.play();

      camion.classList.add('action-clic');
      oeilG.classList.add('phare-actif');
      oeilD.classList.add('phare-actif');

      timer = setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
        
        camion.classList.remove('action-clic');
        oeilG.classList.remove('phare-actif');
        oeilD.classList.remove('phare-actif');
      }, 2000);
    });
  </script>

</body>
</html>
