<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menexia The Sexy Truck</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      cursor: pointer;
      overflow: hidden;
    }

    /* Le conteneur global */
    .conteneur-camion {
      position: relative;
      display: inline-block;
      transition: transform 0.2s ease-out;
      will-change: transform;
    }

    /* L'image de base */
    .image-base {
      max-width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s ease;
    }

    /* Effet survol de la souris */
    .conteneur-camion:hover .image-base {
      transform: scale(1.03);
    }

    /* --- ANIMATION : SECOUSSE + ZOOM --- */
    @keyframes secousseEtZoom {
      0% { transform: scale(1.2) translate(0, 0) rotate(0deg); }
      20% { transform: scale(1.2) translate(-4px, 4px) rotate(-1deg); }
      40% { transform: scale(1.2) translate(-4px, -4px) rotate(1deg); }
      60% { transform: scale(1.2) translate(4px, 4px) rotate(0deg); }
      80% { transform: scale(1.2) translate(4px, -4px) rotate(1deg); }
      100% { transform: scale(1.2) translate(0, 0) rotate(-1deg); }
    }

    /* Actif lors du clic */
    .action-clic {
      animation: secousseEtZoom 0.1s infinite !important;
    }

    /* --- LA BOUCHE --- */
    .bouche-conteneur {
      position: absolute;
      bottom: 15%; /* À ajuster si besoin */
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 40px;
      overflow: hidden;
    }

    .bouche {
      width: 100%;
      height: 100%;
      background-color: #400;
      border: 3px solid #000;
      border-radius: 50% / 100% 100% 0 0;
      transition: transform 0.15s ease-out;
      transform: scaleY(0);
      transform-origin: top;
    }

    .bouche-ouverte {
      transform: scaleY(1);
    }

    /* --- LES PHARES / YEUX --- */
    .oeil {
      position: absolute;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.1s ease-in, box-shadow 0.2s ease-out;
    }

    /* Coordonnées ajustées */
    #oeil-gauche {
      top: 37%;
      left: 29%;
    }

    #oeil-droit {
      top: 36.3%;
      right: 60.70%;
    }

    .phare-actif {
      opacity: 1;
      box-shadow: 0 0 40px 15px #fff, 0 0 70px 30px #ff0;
    }
  </style>
</head>
<body>

  <div class="conteneur-camion" id="monCamion">
    <img src="mablague.jpg" alt="Blague Camion" class="image-base">
    
    <div class="bouche-conteneur">
      <div class="bouche" id="maBouche"></div>
    </div>
    
    <div class="oeil" id="oeil-gauche"></div>
    <div class="oeil" id="oeil-droit"></div>
  </div>

  <audio id="klaxon" src="camion.mp3" preload="auto"></audio>

  <script>
    let timer = null;

    document.addEventListener('click', function() {
      const audio = document.getElementById('klaxon');
      const camion = document.getElementById('monCamion');
      const bouche = document.getElementById('maBouche');
      const oeilG = document.getElementById('oeil-gauche');
      const oeilD = document.getElementById('oeil-droit');

      // Si un chrono tourne, on le stoppe
      if (timer) {
        clearTimeout(timer);
      }

      // Rejoue le son
      audio.currentTime = 0;
      audio.play();

      // Active TOUTES les animations
      camion.classList.add('action-clic');
      bouche.classList.add('bouche-ouverte');
      oeilG.classList.add('phare-actif');
      oeilD.classList.add('phare-actif');

      // Arrête tout au bout de 2 secondes
      timer = setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
        
        camion.classList.remove('action-clic');
        bouche.classList.remove('bouche-ouverte');
        oeilG.classList.remove('phare-actif');
        oeilD.classList.remove('phare-actif');
      }, 2000);
    });
  </script>

</body>
</html>
