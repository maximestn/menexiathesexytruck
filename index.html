<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menexia The Sexy Truck</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      cursor: pointer;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Image de la blague -->
  <img src="mablague.jpg" alt="Blague Camion">

  <!-- Fichier audio -->
  <audio id="klaxon" src="camion.mp3" preload="auto"></audio>

  <script>
    // Joue le son au tout premier clic sur la page/image
    document.addEventListener('click', function() {
      const audio = document.getElementById('klaxon');
      audio.play();

      // Arrête le son automatiquement après 2 secondes (2000 ms)
      setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
      }, 2000);
    }, { once: true });
  </script>

</body>
</html>
